url: https://jwildfire.github.io/gsm.bio

template:
  bootstrap: 5

navbar:
  structure:
    left: [articles, reference, news]
    right: [search, github]

reference:
  - title: Package
    desc: What gsm.bio is for and how its statistics are built.
    contents:
      - gsm.bio-package
  - title: Statistics
    desc: >
      One function per family of tests, each a thin wrapper around the base R
      function the design names, and all returning the same result.
    contents:
      - Analyze_GroupDifference
      - Analyze_Correlation
      - Analyze_CorrelationMatrix
      - Analyze_Fit
      - Analyze_Contingency
      - Analyze_Survival
      - Analyze_Screen
      - StatisticsResult
  - title: Widgets
    desc: >
      A bio.viz chart drawn from R, with its statistics computed by the
      functions above when the widget is made and stored in the page, so a
      saved page shows them with no R and no network.
    contents:
      - Widget_GroupComparison
      - Widget_AssociationScatter
      - Widget_CorrelationMatrix
      - Widget_BiomarkerScreen
      - Widget_CrossTab
      - Widget_StratifiedSurvival
  - title: Figures
    desc: >
      The same views as static ggplot2 figures, for a report or a slide, with
      the same statistics from the functions above, and the chart's title,
      subtitle and footnotes. ggplot2 is suggested, not imported.
    contents:
      - Visualize_GroupComparison
      - Visualize_AssociationScatter
      - Visualize_CorrelationMatrix
      - Visualize_BiomarkerScreen
      - Visualize_CrossTab
      - Visualize_StratifiedSurvival
  - title: Tables
    desc: >
      The same views' statistics as tables, one row per statistic, written by
      the program's display rules, and an RTF writer for a report. r2rtf is
      suggested, not imported.
    contents:
      - Table_GroupComparison
      - Table_AssociationScatter
      - Table_CorrelationMatrix
      - Table_BiomarkerScreen
      - Table_CrossTab
      - Table_StratifiedSurvival
      - Write_RTF
  - title: Batch
    desc: >
      bio.viz's chart specifications run against a dataset to figures and RTF
      tables in a folder, one per specification or one per biomarker.
    contents:
      - Run_Specifications
  - title: Synthetic study
    desc: >
      A made-up biomarker study with three planted effects of known size, for
      proving the statistics and for the charts to draw.
    contents:
      - Synthetic_Results
      - Synthetic_Participants
      - Synthetic_Outcomes
      - Synthetic_Truth

articles:
  - title: Gallery
    navbar: ~
    contents:
      - articles/gallery
