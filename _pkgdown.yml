url: https://jwildfire.github.io/gsm.bio

template:
  bootstrap: 5
  # The look of rainbow-hex 1.0 (https://github.com/jwildfire/rainbow-hex): paper,
  # graphite, plum links, Instrument Serif / Instrument Sans / IBM Plex Mono, and
  # the seven-hue spectrum as a thin honeycomb strip. It is the theme gsm.safety's
  # site wears, copied from its _pkgdown.yml and pkgdown/extra.css at commit
  # d3bde85, so the two R sites read as one. The palette and fonts come in here
  # as bslib variables; pkgdown/extra.css carries the navbar and footer bands
  # with their strip. No colour here is a project's own.
  bslib:
    bg: "#fafaf8"
    fg: "#1f2328"
    primary: "#6c3270"
    secondary: "#5b6470"
    light: "#f3f4f1"
    dark: "#1f2328"
    body-secondary-color: "#5b6470"
    body-tertiary-color: "#98a0aa"
    body-secondary-bg: "#f3f4f1"
    body-tertiary-bg: "#f3f4f1"
    border-color: "#e4e6e3"
    link-color: "#6c3270"
    link-hover-color: "#522456"
    code-color: "#1f2328"
    pre-color: "#1f2328"
    # pkgdown's own variables: the navbar and footer bands, and the navbar's
    # height with the 9px honeycomb strip extra.css adds above the brand.
    navbar-bg: "#f3f4f1"
    pkgdown-nav-height: 68px
    pkgdown-footer-bg: "#f3f4f1"
    pkgdown-footer-color: "#5b6470"
    pkgdown-footer-border-color: "#e4e6e3"
    base_font: '"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif'
    heading_font: '"Instrument Serif", Georgia, "Times New Roman", serif'
    code_font: '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
    headings-font-weight: 400
    headings-line-height: 1.15
    h1-font-size: 2rem
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

navbar:
  structure:
    left: [articles, reference, news]
    right: [search, github]

reference:
  - title: Package
    desc: What gsm.bio is for and how its statistics are built.
    contents:
      - gsm.bio-package
  - title: Statistics
    desc: >
      One function per family of tests, each a thin wrapper around the base R
      function the design names, and all returning the same result.
    contents:
      - Analyze_GroupDifference
      - Analyze_GroupDifferenceBy
      - Analyze_Correlation
      - Analyze_CorrelationMatrix
      - Analyze_Fit
      - Analyze_Contingency
      - Analyze_Survival
      - Analyze_Screen
      - Analyze_DifferenceGrid
      - StatisticsResult
  - title: Widgets
    desc: >
      A bio.viz chart drawn from R, with its statistics computed by the
      functions above when the widget is made and stored in the page, so a
      saved page shows them with no R and no network.
    contents:
      - Widget_GroupComparison
      - Widget_AssociationScatter
      - Widget_CorrelationMatrix
      - Widget_BiomarkerScreen
      - Widget_CrossTab
      - Widget_StratifiedSurvival
  - title: The app, and widgets in a Shiny page
    desc: >
      The six charts as one Shiny app, and the pieces it is made of: the
      widgets drawn in a Shiny page, where the R session behind the page
      answers every statistic a chart asks for, so every view a reader
      reaches has its numbers. shiny is suggested, not imported.
    contents:
      - RunApp
      - Serve_Statistics
      - gsm.bio-shiny
  - title: Figures
    desc: >
      The same views as static ggplot2 figures, for a report or a slide, with
      the same statistics from the functions above, and the chart's title,
      subtitle and footnotes. ggplot2 is suggested, not imported.
    contents:
      - Visualize_GroupComparison
      - Visualize_AssociationScatter
      - Visualize_CorrelationMatrix
      - Visualize_BiomarkerScreen
      - Visualize_CrossTab
      - Visualize_StratifiedSurvival
  - title: Tables
    desc: >
      The same views' statistics as tables, one row per statistic, written by
      the program's display rules, and an RTF writer for a report. r2rtf is
      suggested, not imported.
    contents:
      - Table_GroupComparison
      - Table_AssociationScatter
      - Table_CorrelationMatrix
      - Table_BiomarkerScreen
      - Table_CrossTab
      - Table_StratifiedSurvival
      - Write_RTF
  - title: Batch
    desc: >
      bio.viz's chart specifications run against a dataset to figures and RTF
      tables in a folder, one per specification or one per biomarker.
    contents:
      - Run_Specifications
  - title: Synthetic study
    desc: >
      A made-up biomarker study with three planted effects of known size, for
      proving the statistics and for the charts to draw.
    contents:
      - Synthetic_Results
      - Synthetic_Participants
      - Synthetic_Outcomes
      - Synthetic_Truth

articles:
  - title: Gallery
    navbar: ~
    contents:
      - articles/gallery
  - title: The app
    navbar: ~
    contents:
      - articles/app
