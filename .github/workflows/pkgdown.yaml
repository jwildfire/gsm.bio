# The reference site.
#
# A pull request to dev builds the site and stops, so a page that will not
# build is caught before it merges. A push to dev builds it and deploys it to
# the root of the gh-pages branch, which GitHub Pages serves at
# https://jwildfire.github.io/gsm.bio/. Until the package has a release, the
# site root is the dev build.
#
# Derived from https://github.com/r-lib/actions/tree/v2/examples
name: pkgdown

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    # A draft marked ready is checked again, which is what lets auto-merge be
    # switched on: GitHub allows it only while a required check is pending.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# The deploy step pushes to gh-pages; a new repository's token is read-only
# unless the workflow asks for more.
permissions:
  contents: write

jobs:
  pkgdown:
    name: pkgdown
    runs-on: ubuntu-latest
    # Deploys queue rather than race; pull request builds never wait on each other.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # build_site_github_pages() writes docs/.nojekyll, so Pages serves the
      # files as they are.
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to the gh-pages branch
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
