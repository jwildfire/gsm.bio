# R CMD check on every pull request to dev and every push to dev.
#
# One job on one runner, so the check it reports is named exactly
# "R-CMD-check": the dev ruleset requires a check of that name, and a matrix
# would append the runner to it. The house rule is no errors, warnings or
# notes, so a note fails the run.
#
# Derived from https://github.com/r-lib/actions/tree/v2/examples
name: R-CMD-check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  R-CMD-check:
    name: R-CMD-check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # R checks the runner's clock against a public time service and raises a
      # note when that service does not answer. A note fails this run, so an
      # outage elsewhere would block every merge; file timestamps are still
      # checked against the runner's own clock.
      _R_CHECK_SYSTEM_CLOCK_: 0
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"note"'
